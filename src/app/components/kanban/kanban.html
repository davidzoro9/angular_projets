<div class="kanban-container">
  <div class="kanban-header">
    <h3>Signal-Driven Kanban Board</h3>
    <span class="badge-status">State Management: Signals</span>
  </div>

  <!-- Add Task Form -->
  <div class="task-form">
    <input 
      type="text" 
      [(ngModel)]="newTaskTitle" 
      placeholder="Add a new task..." 
      class="form-input"
    />
    <select [(ngModel)]="newTaskCategory" class="form-select">
      <option value="Frontend">Frontend</option>
      <option value="Backend">Backend</option>
      <option value="DevOps">DevOps</option>
      <option value="Testing">Testing</option>
    </select>
    <button (click)="addTask()" class="btn-add">Add</button>
  </div>

  <!-- Columns Grid -->
  <div class="kanban-board">
    <div 
      class="kanban-column" 
      *ngFor="let col of columns"
      (dragover)="onDragOver($event)"
      (drop)="onDrop(col.key)"
    >
      <h4 class="column-title">
        {{ col.title }} 
        <span class="count-badge">{{ getTasksByStatus(col.key).length }}</span>
      </h4>

      <div class="tasks-list">
        <div 
          class="task-card" 
          *ngFor="let task of getTasksByStatus(col.key)"
          draggable="true"
          (dragstart)="onDragStart(task.id)"
        >
          <div class="task-meta">
            <span class="task-category" [attr.data-cat]="task.category">{{ task.category }}</span>
            <button class="btn-delete" (click)="deleteTask(task.id)">×</button>
          </div>
          <p class="task-title">{{ task.title }}</p>
        </div>
        
        <div class="empty-column-msg" *ngIf="getTasksByStatus(col.key).length === 0">
          Drop tasks here
        </div>
      </div>
    </div>
  </div>
</div>
